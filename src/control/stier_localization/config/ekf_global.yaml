# ekf_global.yaml
frequency: 50
sensor_timeout: 1.5
two_d_mode: true
publish_tf: true
provide_odom_frame: false

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map

predict_to_current_time: true
transform_time_offset: 0.0

# --- GPS (절대 위치만, yaw는 보통 끔 / differential로 부드럽게) ---
odom0: /odometry/gps
odom0_config: [true, true, false,   false, false, false,   false, false, false,   false, false, false,   false, false, false]
odom0_differential: false              # ★ 튐 억제 핵심
odom0_queue_size: 5

# --- 로컬 odom의 twist로 예측 보강 (GPS 사이사이 메우기) ---
odom1: /odometry/local
odom1_config: [false,false,false,   false,false,false,   true,false,false,   false,false,true,   false,false,false]
odom1_differential: false
odom1_queue_size: 5

# --- IMU yaw-rate (선택: 안정성 ↑) ---
imu0: /imu/data
imu0_config: [false,false,false,   false,false,false,   false,false,false,   false,false,true,   false,false,false]
imu0_queue_size: 10
