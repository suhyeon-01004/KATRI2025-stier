frequency: 50
sensor_timeout: 0.3
two_d_mode: true
publish_tf: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# wheel/odom: 선속도 신뢰 (pose는 낮게)
odom0: wheel/odom
odom0_config: [false, false, false,   # x y z (pose)
               false, false, false,   # roll pitch yaw (pose)
               true,  false,  false,   # vx vy vz (twist)
               false, false, true]    # vroll vpitch vyaw (twist)
odom0_differential: false
odom0_queue_size: 5
#odom0_delay: 0.2 


# IMU: yaw rate + orientation
imu0: imu/data
imu0_config: [false, false, false,
              true,  true,  false,     # roll pitch yaw (orientation)
              false, false, false,
              false, false, true,
              false, false, false,
              false, false, false]     # vyaw (angular vel z)
imu0_differential: false
imu0_remove_gravitational_acceleration: true
imu0_queue_size: 10
